[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"
core-ktx = "1.15.0"
appcompat = "1.7.0"
activity-compose = "1.10.0"
compose-bom = "2024.12.01"
navigation-compose = "2.8.5"
room = "2.6.1"
lifecycle-viewmodel-compose = "2.8.7"
coroutines-android = "1.9.0"
junit = "4.13.2"
